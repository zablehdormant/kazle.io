<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kazle</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#777; --tile:#e8e8e8; --accent:#2e7d32; --err:#c62828;
          --hint:#e65100; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --muted:#999; --tile:#2a2a2a; --accent:#66bb6a; --err:#ef5350;
            --hint:#ffb74d; --card:#1e1e1e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh; }
  h1 { letter-spacing:.3em; margin:1.2rem 0 .2rem; padding-left:.3em; }
  .sub { color:var(--muted); margin:0 0 .8rem; text-align:center; padding:0 1rem; }
  button { font:inherit; font-size:1rem; padding:.4rem 1rem; border-radius:6px; cursor:pointer;
           border:1px solid var(--muted); background:var(--tile); color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary, .tabs button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  button[hidden] { display:none; }
  .tabs, .actions { display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; }
  .tabs { margin-bottom:.9rem; }
  .row { display:flex; gap:.4rem; margin:.3rem 0; }
  .tile { width:3rem; height:3rem; display:grid; place-items:center; background:var(--tile);
          font-size:1.6rem; font-weight:700; text-transform:uppercase; border-radius:6px; }
  .tile.hit { background:var(--accent); color:#fff; }
  .tile.changed { outline:3px solid var(--accent); }
  .tile.hintpos { outline:3px dashed var(--hint); }
  .target .tile { background:transparent; border:2px dashed var(--muted); }
  .hintrow .tile { background:transparent; border:2px dashed var(--hint); color:var(--hint); }
  #history { margin:1rem 0 .4rem; display:flex; flex-direction:column; align-items:center; }
  #msg { min-height:1.5rem; color:var(--err); margin:.6rem 0; text-align:center; padding:0 1rem; }
  #msg.ok { color:var(--accent); font-weight:700; }
  #msg.hint { color:var(--hint); font-weight:600; }
  form { display:flex; gap:.5rem; }
  input { font-size:1.2rem; width:7rem; text-transform:uppercase; padding:.4rem; text-align:center; }
  .actions { margin-top:.4rem; }
  footer { margin-top:auto; padding:1.5rem; color:var(--muted); text-align:center; line-height:1.5; }

  #modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; place-items:center; z-index:10; padding:1rem; }
  #modal.open { display:grid; }
  .card { background:var(--card); border-radius:14px; padding:1.5rem; max-width:26rem; width:100%;
          text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.35); }
  .card h2 { margin:.2rem 0; font-size:1.7rem; }
  .card p { margin:.3rem 0; color:var(--muted); }
  .stats { display:flex; justify-content:center; gap:1.5rem; margin:1rem 0; }
  .stats b { display:block; font-size:1.7rem; }
  .stats span { color:var(--muted); font-size:.85rem; }
  .path { display:flex; flex-wrap:wrap; gap:.3rem .5rem; justify-content:center; font-weight:700; letter-spacing:.05em; margin:.8rem 0; }
  .path .last { color:var(--accent); }
  .card .actions { margin-top:1.1rem; }
  #confetti i { position:fixed; top:-16px; width:9px; height:15px; z-index:11; pointer-events:none;
                animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { #confetti { display:none; } }
</style>

  <p class="sub">Change one letter at a time, using real words, until you reach KAZA.</p>

  <div id="history"></div>
  <div id="hintHolder"></div>

    <button class="primary">Go</button>

  <div class="actions">
    <button type="button" id="hintBtn">💡 Hint</button>
    <button type="button" id="skipBtn" hidden>Skip</button>
    <button type="button" id="resBtn" class="primary" hidden>🎉 Results</button>

      <p id="mNote"></p>
      <div class="actions">
        <button type="button" id="shareBtn">Share</button>
        <button type="button" id="mainBtn" class="primary"></button>
        <button type="button" id="closeBtn">Close</button>

<script>
const TARGET = "kaza";
const $ = id => document.getElementById(id);

// localStorage can throw (private mode, blocked storage) so every access is guarded.
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const patterns = w => [0, 1, 2, 3].map(i => w.slice(0, i) + "_" + w.slice(i + 1));

function oneApart(a, b) {
  let diff = 0;
  for (let i = 0; i < 4; i++) if (a[i] !== b[i]) diff++;
  return diff === 1;
}

const parse = t => [...new Set(t.split(/\s+/).map(w => w.toLowerCase()).filter(w => /^[a-z]{4}$/.test(w)))];

// words.txt via fetch; falls back to the embedded copy (fetch fails on file:// pages).
async function loadWords() {
  try {
    const res = await fetch("words.txt");
    if (!res.ok) throw new Error(res.status);
    const w = parse(await res.text());
    if (w.length > 100) return w;
  } catch {}
  return parse($("wordlist").textContent);
}

let wordSet, dist, buckets, candidates;

// Breadth-first search outward from TARGET: dist[w] = fewest steps from w to kaza.
function bfs(words) {
  buckets = new Map();
  for (const w of words)
    for (const p of patterns(w)) {
      if (!buckets.has(p)) buckets.set(p, []);
      buckets.get(p).push(w);
    }
  dist = new Map([[TARGET, 0]]);
  const queue = [TARGET];
  for (let h = 0; h < queue.length; h++) {
    const u = queue[h];
    for (const v of neighbours(u))
      if (!dist.has(v)) { dist.set(v, dist.get(u) + 1); queue.push(v); }
  }
}
const neighbours = w => patterns(w).flatMap(p => buckets.get(p) || []).filter(v => v !== w);

// Next word on a shortest path from w to KAZA (null if none).
function nextStep(w) {
  const d = dist.get(w);
  if (!d) return null;
  return neighbours(w).filter(v => dist.get(v) === d - 1).sort()[0] || null;
}

// Integer-only hash (the old version overflowed 2^53 and could return a negative index).
function hash(n) {
  let x = Math.imul(n ^ 0x9e3779b9, 2654435761) >>> 0;
  x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0;
  x ^= x >>> 13; x = Math.imul(x, 3266489917) >>> 0;
  x ^= x >>> 16;
  return x >>> 0;
}
// UTC date, so everyone in the world gets the same daily word.
const todayKey = () => new Date().toISOString().slice(0, 10);
const dailyStart = () => candidates[hash(+todayKey().replace(/-/g, "")) % candidates.length];
const randomStart = avoid => {
  let w;
  do w = candidates[Math.floor(Math.random() * candidates.length)]; while (w === avoid && candidates.length > 1);
  return w;
};

/* ---------- state ---------- */
let mode, S;   // S = { start, path[], hints, hint:{at,level}, done, date }
const cur = () => S.path[S.path.length - 1];
const moves = () => S.path.length - 1;
const par = () => dist.get(S.start);
const activeHint = () => (S.hint.at === S.path.length ? S.hint.level : 0);
const getStats = () => store.get("kazle:stats") || { daily: 0, endless: 0 };

const fresh = start => ({ start, path: [start], hints: 0, hint: { at: 1, level: 0 }, done: false,
                          date: mode === "daily" ? todayKey() : null });
const save = () => store.set("kazle:" + mode, S);

function valid(s, expectedStart) {
  if (!s || !Array.isArray(s.path) || !s.path.length) return false;
  if (expectedStart && s.path[0] !== expectedStart) return false;
  if (!s.path.every(w => wordSet.has(w)) || !dist.has(s.path[0])) return false;
  for (let i = 1; i < s.path.length; i++) if (!oneApart(s.path[i - 1], s.path[i])) return false;
  s.start = s.path[0];
  s.hints = +s.hints || 0;
  s.hint = s.hint && typeof s.hint.at === "number" ? s.hint : { at: 1, level: 0 };
  s.done = s.path[s.path.length - 1] === TARGET;
  return true;
}

function loadPuzzle(m) {
  mode = m;
  const saved = store.get("kazle:" + m);
  if (m === "daily") {
    const start = dailyStart();
    return saved && saved.date === todayKey() && valid(saved, start) ? saved : fresh(start);
  }
  return valid(saved) ? saved : fresh(randomStart());
}

/* ---------- rendering ---------- */
function renderWord(el, word, prev, hintIdx = -1) {
  el.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const t = document.createElement("div");
    t.className = "tile" + (word[i] === TARGET[i] ? " hit" : "") +
                  (prev && prev[i] !== word[i] ? " changed" : "") + (i === hintIdx ? " hintpos" : "");
    t.textContent = word[i];
    el.appendChild(t);
  }
}
const newRow = (cls = "") => { const r = document.createElement("div"); r.className = "row " + cls; return r; };

function setMsg(text, cls = "") { const m = $("msg"); m.className = cls; m.textContent = text; }

const resultText = () => {
  const extra = S.hints ? ` Hints used: ${S.hints}.` : "";
  return (moves() === par() ? `Perfect! ${moves()} steps, the minimum.` : `Solved in ${moves()} steps (best is ${par()}).`) + extra;
};

function render() {
  renderWord($("target"), TARGET);
  const hl = S.done ? 0 : activeHint();
  const step = S.done ? null : nextStep(cur());
  const idx = step ? [0, 1, 2, 3].find(i => step[i] !== cur()[i]) : -1;

  const hist = $("history"); hist.innerHTML = "";
  S.path.forEach((w, i) => {
    const r = newRow();
    renderWord(r, w, S.path[i - 1], i === S.path.length - 1 && hl >= 1 ? idx : -1);
    hist.appendChild(r);
  });
  const hh = $("hintHolder"); hh.innerHTML = "";
  if (hl >= 2 && step) { const r = newRow("hintrow"); renderWord(r, step); r.style.justifyContent = "center"; hh.appendChild(r); }

  if (S.done) setMsg(resultText(), "ok");
  else if (hl === 1) setMsg(`Hint: change letter ${idx + 1}.`, "hint");
  else if (hl >= 2) setMsg(`Hint: try ${step.toUpperCase()}.`, "hint");
  else setMsg("");

  $("tabDaily").setAttribute("aria-pressed", mode === "daily");
  $("tabEndless").setAttribute("aria-pressed", mode === "endless");
  $("guess").disabled = S.done;
  $("hintBtn").hidden = S.done;
  $("hintBtn").disabled = hl >= 2;
  $("skipBtn").hidden = mode !== "endless" || S.done;
  $("resBtn").hidden = !S.done;

  const st = getStats();
  $("footer").innerHTML =
    (mode === "daily" ? `Daily ${S.date}` : `Endless · ${st.endless} solved`) +
    `<br>${S.start.toUpperCase()} → KAZA · most efficient route: ${par()} steps · moves: ${moves()} · hints: ${S.hints}` +
    (S.done && mode === "daily" ? `<br>Come back tomorrow for a new word, or try Endless.` : "");
}

/* ---------- congratulations ---------- */
function openModal(celebrate) {
  const perfect = moves() === par();
  $("mTitle").textContent = perfect && !S.hints ? "Flawless!" : "Congratulations!";
  $("mSub").textContent = `You reached KAZA ${perfect ? "by the shortest route." : "— nice work."}`;
  $("mSteps").textContent = moves();
  $("mPar").textContent = par();
  $("mHints").textContent = S.hints;
  const p = $("mPath"); p.innerHTML = "";
  S.path.forEach((w, i) => {
    if (i) p.append("→");
    const s = document.createElement("span"); s.textContent = w.toUpperCase();
    if (i === S.path.length - 1) s.className = "last";
    p.appendChild(s);
  });
  $("mNote").textContent = mode === "daily" ? "A new daily word arrives at 00:00 UTC." :
                           `Endless words solved: ${getStats().endless}`;
  $("mainBtn").textContent = mode === "daily" ? "Play Endless" : "Next word";
  $("shareBtn").textContent = "Share";
  $("modal").classList.add("open");
  $("mainBtn").focus();
  if (celebrate) confetti();
}
const closeModal = () => $("modal").classList.remove("open");

function confetti() {
  const box = $("confetti"), colors = ["#66bb6a", "#ffca28", "#42a5f5", "#ef5350", "#ab47bc"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("i");
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 2.5 + "s";
    c.style.animationDelay = Math.random() * .6 + "s";
    box.appendChild(c);
  }
  setTimeout(() => box.innerHTML = "", 5500);
}

async function share() {
  const text = `Kazle ${mode === "daily" ? S.date : "(endless)"} — ${moves()} steps (best ${par()}), ${S.hints} hints\n` +
               S.path.map(w => w.toUpperCase()).join(" → ");
  try { await navigator.clipboard.writeText(text); $("shareBtn").textContent = "Copied!"; }
  catch { $("shareBtn").textContent = "Copy failed"; }
  setTimeout(() => $("shareBtn").textContent = "Share", 1500);
}

/* ---------- actions ---------- */
function setMode(m) {
  store.set("kazle:mode", m);
  S = loadPuzzle(m); save(); closeModal(); render();
  if (!S.done) $("guess").focus();
}
function newEndless() {
  mode = "endless"; S = fresh(randomStart(S && mode === "endless" ? S.start : null));
  save(); closeModal(); render(); $("guess").focus();
}
function onHint() {
  if (S.done) return;
  const lvl = activeHint();
  if (lvl >= 2) return;
  S.hint = { at: S.path.length, level: lvl + 1 };
  S.hints++; save(); render();
}

function onSubmit(e) {
  e.preventDefault();
  if (S.done) return;
  const g = $("guess").value.trim().toLowerCase();
  if (!/^[a-z]{4}$/.test(g)) return setMsg("Enter a 4-letter word.");
  if (!wordSet.has(g)) return setMsg("Not in the word list.");
  if (!oneApart(cur(), g)) return setMsg("Change exactly one letter.");
  if (!dist.has(g)) return setMsg("Dead end: no route to KAZA from that word.");
  S.path.push(g); $("guess").value = "";
  if (g === TARGET) {
    S.done = true;
    const st = getStats(); st[mode]++; store.set("kazle:stats", st);
  }
  save(); render();
  if (S.done) openModal(true);
}

async function main() {
  const words = await loadWords();
  if (!words.includes(TARGET)) words.push(TARGET);
  wordSet = new Set(words);
  bfs(words);
  // Start words: reachable, and between 3 and 8 steps away.
  candidates = words.filter(w => dist.get(w) >= 3 && dist.get(w) <= 8).sort();

  $("form").addEventListener("submit", onSubmit);
  $("hintBtn").addEventListener("click", onHint);
  $("skipBtn").addEventListener("click", newEndless);
  $("resBtn").addEventListener("click", () => openModal(false));
  $("tabDaily").addEventListener("click", () => mode !== "daily" && setMode("daily"));
  $("tabEndless").addEventListener("click", () => mode !== "endless" && setMode("endless"));
  $("shareBtn").addEventListener("click", share);
  $("closeBtn").addEventListener("click", closeModal);
  $("mainBtn").addEventListener("click", () => mode === "daily" ? setMode("endless") : newEndless());
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  // New UTC day while the tab was open: load the new daily word.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && mode === "daily" && S.date !== todayKey()) setMode("daily");
  });

  const saved = store.get("kazle:mode");
  S = loadPuzzle(saved === "endless" ? "endless" : "daily");
  save(); render();
  if (!S.done) $("guess").focus();
}
main().catch(err => { $("footer").textContent = "Something went wrong loading the game."; console.error(err); });
</script>
</body>
</html>
